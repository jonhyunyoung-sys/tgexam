<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>온라인 시험지</title>
<style>
  :root {
    --navy: #1e3a5f;
    --blue: #2563eb;
    --blue-soft: #eff6ff;
    --green: #15803d;
    --green-soft: #dcfce7;
    --red: #b91c1c;
    --red-soft: #fee2e2;
    --slate: #0f172a;
    --muted: #475569;
    --border: #cbd5e1;
    --bg: #f1f5f9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--slate);
    line-height: 1.55;
    padding-bottom: 64px;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--navy);
    color: #fff;
    padding: 12px 18px;
  }
  .topbar-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .topbar h1 { margin: 0; font-size: 1.1rem; }
  .pill {
    background: rgba(255,255,255,0.18);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 700;
    white-space: nowrap;
  }
  .container {
    max-width: 900px;
    margin: 18px auto;
    padding: 0 14px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(15,23,42,0.04);
  }
  .info-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .field label {
    display: block;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .field input {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    font-family: inherit;
    background: #f8fafc;
  }
  .passage {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-left: 4px solid var(--navy);
    border-radius: 8px;
    padding: 12px 14px;
    margin: 10px 0;
    white-space: pre-line;
    font-size: 0.96rem;
  }
  .q-imgs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 10px 0;
  }
  .q-imgs img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .q-imgs.original-question { display:block;max-width:760px;border:1px solid var(--border);border-radius:8px;overflow:hidden; }
  .q-imgs.original-question img { display:block;width:100%;border:0;border-radius:0;margin:0; }
  .choices {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
  }
  .card { overflow-wrap:anywhere; }
  .short-input { max-width:100%;box-sizing:border-box; }
  .choice-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: #fff;
    font-family: inherit;
    font-size: 0.96rem;
    cursor: pointer;
    color: var(--slate);
  }
  .choice-btn.selected {
    border-color: var(--blue);
    background: var(--blue-soft);
    font-weight: 700;
  }
  .check-box {
    width: 22px;
    height: 22px;
    border: 2px solid #94a3b8;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 0.85rem;
    font-weight: 800;
    flex-shrink: 0;
  }
  .choice-btn.selected .check-box {
    background: var(--blue);
    border-color: var(--blue);
  }
  .short-input {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 1rem;
    font-family: inherit;
    margin-top: 8px;
  }
  .omr-pages-wrap img {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 12px;
    background: #fff;
  }
  .omr-pad-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #e2e8f0;
    flex-wrap: wrap;
  }
  .omr-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .omr-pill {
    width: 40px;
    height: 38px;
    border-radius: 9px;
    border: 1.5px solid var(--border);
    background: #fff;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .omr-pill.selected {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }
  .judgment-pill { width: auto; min-width: 80px; height: auto; min-height: 42px; padding: 8px 16px; white-space: nowrap; }
  .submit-bar { text-align: center; margin-top: 22px; }
  .btn-submit {
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px 36px;
    font-size: 1.05rem;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
  }
  .result-banner { display: none; border: 2px solid var(--navy); background: #f8fbff; }
  .result-banner.show { display: block; }
  .away-banner {
    display: none;
    border: 2px solid var(--red);
    background: var(--red-soft);
    color: var(--red);
    font-weight: 700;
    font-size: 0.92rem;
    padding: 12px 16px;
  }
  .away-banner.show { display: block; }
  .exam-protected {
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .exam-protected input, .exam-protected textarea {
    user-select: text;
    -webkit-user-select: text;
  }
  .pill-timer-warn {
    background: #dc2626 !important;
    color: #fff !important;
  }
  .ox-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
    gap: 8px;
    margin-top: 12px;
  }
  .ox-item {
    border-radius: 9px;
    padding: 8px 6px;
    text-align: center;
    font-weight: 800;
    font-size: 0.9rem;
  }
  .ox-item.ok { background: var(--green-soft); color: var(--green); }
  .ox-item.bad { background: var(--red-soft); color: var(--red); }
  .ox-item.partial { background: #fff7ed; color: #9a3412; }
  .matching-board { position:relative;width:100%;margin:12px 0;background:#f8fafc;border:1px solid var(--border);border-radius:10px; }
  .matching-board svg { position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden; }
  .matching-node { position:absolute;transform:translateY(-50%);min-height:44px;width:30%;border:2px solid var(--border);border-radius:10px;padding:8px 5px;background:white;color:var(--navy);font:inherit;cursor:pointer;overflow-wrap:anywhere; }
  .matching-source { left:0;touch-action:none; }
  .matching-target { right:0; }
  .matching-node.active { border-color:var(--blue);background:#dbeafe; }
  .matching-node.connected { border-color:#15803d; }
  .matching-actions { display:flex;gap:8px;flex-wrap:wrap; }
  .matching-actions button { border:1px solid var(--border);border-radius:7px;background:white;padding:8px;min-height:40px;font:inherit;cursor:pointer; }
  .workspace-tools { display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:var(--student-header-height,64px);z-index:40; }
  .workspace-tools button,.note-actions button,.note-actions select,.note-close,.question-note-btn { font:inherit;cursor:pointer;min-height:40px;padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:white;color:var(--navy); }
  .workspace-tools input[type=range] { width:150px; }
  .exam-viewport { overflow-x:auto;padding-bottom:8px; }
  #examBody { width:100%; }
  .question-note-row { display:flex;justify-content:flex-end;margin-bottom:8px;width:100%; }
  .question-note-btn { font-size:.85rem; }
  .notes-panel { position:fixed;right:12px;top:76px;bottom:12px;width:430px;max-width:calc(100vw - 24px);z-index:60;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 36px #0f172a30;display:flex;flex-direction:column;overflow:hidden; }
  .notes-panel[hidden] { display:none; }
  .note-heading { padding:12px;border-bottom:1px solid var(--border); }
  .note-actions { display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px; }
  .note-actions button[aria-pressed=true] { color:white;background:var(--blue);border-color:var(--blue); }
  .note-paper-scroll { overflow:auto;padding:10px;flex:1;min-height:0;overscroll-behavior:contain; }
  #questionNoteCanvas { display:block;width:100%;height:auto;background:repeating-linear-gradient(white 0px,white 27px,#e2e8f0 28px);border:1px solid var(--border);border-radius:6px;touch-action:none;user-select:none;-webkit-user-select:none; }
  @media(min-width:1000px) { .container.notes-open { width:calc(100% - 474px);max-width:1050px;margin-left:max(14px,calc((100vw - 1520px)/2));margin-right:450px; } }
  @media(max-width:640px) { .notes-panel { top:90px;right:6px;bottom:6px;max-width:calc(100vw - 12px); } .topbar-inner { flex-wrap:wrap; } }
  @media (max-width: 640px) {
    .info-grid { grid-template-columns: repeat(3, 1fr); }
  }
  img[data-zoomable] { cursor:zoom-in; }
  .source-image-modal { position:fixed;inset:0;z-index:250;background:#0f172ac9;padding:16px;display:flex;flex-direction:column;gap:10px; }
  .source-image-modal[hidden] { display:none; }
  .source-image-tools { display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:white;padding:10px;border-radius:10px; }
  .source-image-tools button { font:inherit;cursor:pointer;border:1px solid #cbd5e1;background:white;border-radius:7px;padding:8px 12px;min-height:40px; }
  .source-image-stage { flex:1;min-height:0;overflow:auto;background:#e2e8f0;border-radius:10px;padding:12px; }
  .source-image-stage img { display:block;max-width:none;height:auto;margin:0 auto;background:white; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div style="display:flex;align-items:center;gap:10px;">
      <img id="headerLogo" alt="로고" style="display:none;height:34px;border-radius:6px;background:#fff;padding:2px;" />
      <h1 id="examTitle">시험지 불러오는 중...</h1>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="pill" id="timerPill" style="display:none;">⏱ -</div>
      <div class="pill" id="progressPill">-</div>
    </div>
  </div>
</header>

<main class="container" id="mainRoot">
  <div class="card" id="loadingBox" style="text-align:center;padding:42px 20px;color:var(--muted);font-weight:600;">
    시험지를 불러오는 중입니다. 잠시만 기다려 주세요...
  </div>
</main>

<!-- Source image viewer -->
<div id="sourceImageModal" class="source-image-modal" role="dialog" aria-modal="true" aria-label="원본 이미지 확대" hidden>
  <div class="source-image-tools"><strong id="sourceImageTitle" style="flex:1;">원본 이미지</strong><button type="button" id="sourceImageMinus" aria-label="이미지 축소">−</button><output id="sourceImageScaleLabel" aria-live="polite">100%</output><button type="button" id="sourceImagePlus" aria-label="이미지 확대">＋</button><button type="button" id="sourceImageFit">화면 맞춤</button><button type="button" id="sourceImageOriginal">원본 크기</button><button type="button" id="sourceImageClose">닫기</button></div>
  <div id="sourceImageStage" class="source-image-stage"><img id="sourceImageLarge" alt="확대한 원본 이미지" /></div>
</div>

<script>
const CIRCLED = ["①", "②", "③", "④", "⑤"];
const DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbykvpnccwVJLeZDZDklKIuMgNS8PDWiGZ8m8gVT0mAUNeZmqM11n_4G1aok0OKDLFLn/exec";
const params = new URLSearchParams(window.location.search);
const API_URL = (params.get("api") || DEFAULT_API_URL).trim();
const EXAM_ID = (params.get("id") || "").trim();
const TEACHER_TRIAL = params.get("teacher_trial")==="1";
let trialInitialized = false;

let EXAM = null;
let verifiedPin = "";
let displayQuestions = [];
const answers = {};
let awayCount = 0;
let awayTotalMs = 0;
let awaySince = 0;
let blurTimer = null;
let ignoreBlurUntil = 0;
let examSubmitted = false;
let examStartedAt = 0;
let timerInterval = null;
let autoSubmitTriggered = false;
let baseInnerWidth = window.innerWidth;
let baseInnerHeight = window.innerHeight;

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function showInlineNotice(msg) {
  const el = document.getElementById("awayBanner");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
}

function updateAwayBanner() {
  const el = document.getElementById("awayBanner");
  if (!el || awayCount <= 0) return;
  const totalSec = Math.round(awayTotalMs / 1000);
  const maxAway = Math.max(0, Number((EXAM && EXAM.max_away_count) || 0));
  const limitNote = maxAway > 0 ? ` (최대 ${maxAway}회 도달 시 자동 제출)` : "";
  el.textContent = `⚠️ 시험 화면 이탈 감지: ${awayCount}회 (누적 ${totalSec}초)${limitNote} — 다른 창/앱/화면분할 이동 기록이 선생님께 전송됩니다.`;
  el.classList.add("show");
}

function startAway() {
  if (examSubmitted || !EXAM || EXAM.is_open === false || !examStartedAt || awaySince > 0) return;
  awaySince = Date.now();
  awayCount += 1;
  updateAwayBanner();
  const maxAway = Math.max(0, Number(EXAM.max_away_count || 0));
  if (maxAway > 0 && awayCount >= maxAway && !autoSubmitTriggered) {
    autoSubmitTriggered = true;
    showInlineNotice(`🚨 화면 이탈 ${awayCount}회로 제한 횟수(${maxAway}회)에 도달해 답안을 자동 제출합니다.`);
    setTimeout(() => {
      if (!examSubmitted) submitExam(true);
    }, 250);
  }
}

function endAway() {
  if (blurTimer) { clearTimeout(blurTimer); blurTimer = null; }
  if (awaySince > 0) {
    awayTotalMs += Math.max(0, Date.now() - awaySince);
    awaySince = 0;
    updateAwayBanner();
  }
  const maxAway = Math.max(0, Number((EXAM && EXAM.max_away_count) || 0));
  if (maxAway > 0 && awayCount >= maxAway && !examSubmitted && !autoSubmitTriggered) {
    autoSubmitTriggered = true;
    submitExam(true);
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    if (blurTimer) { clearTimeout(blurTimer); blurTimer = null; }
    startAway();
  } else {
    endAway();
  }
});

window.addEventListener("blur", () => {
  if (examSubmitted || !EXAM || EXAM.is_open === false || !examStartedAt || Date.now() < ignoreBlurUntil) return;
  if (blurTimer) clearTimeout(blurTimer);
  blurTimer = setTimeout(() => {
    blurTimer = null;
    if (!document.hasFocus() && !examSubmitted && Date.now() >= ignoreBlurUntil) {
      startAway();
    }
  }, 700);
});

window.addEventListener("focus", () => {
  endAway();
});

window.addEventListener("resize", () => {
  updateStudentWorkspaceLayout();
  if (examSubmitted || !EXAM || EXAM.is_open === false || !examStartedAt) return;
  const w = window.innerWidth;
  const h = window.innerHeight;
  // Detect orientation rotation (width/height swapped) vs actual split-screen width shrink
  if (Math.abs(w - baseInnerHeight) <= 60 && Math.abs(h - baseInnerWidth) <= 120) {
    baseInnerWidth = w;
    baseInnerHeight = h;
    return;
  }
  if (w > baseInnerWidth) baseInnerWidth = w;
  if (w < baseInnerWidth * 0.78) {
    startAway();
  } else if (w >= baseInnerWidth * 0.88 && !document.hidden && document.hasFocus()) {
    endAway();
  }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function optionLabel(q,index) { return q.choice_labels?.[index] || CIRCLED[index] || String(index+1); }
function contentLineBreaks(text) { return String(text || "").replace(/\r\n?/g,"\n").replace(/[\u2028\u2029]/g,"\n").replace(/<br\s*\/?>/gi,"\n"); }
function choiceDisplayText(q,index,value) {
  let text=String(value ?? q.choices?.[index] ?? "").trim();
  const label=String(optionLabel(q,index)).normalize("NFKC").toLowerCase();
  const circled=/^([①-⑳Ⓐ-ⓩ])\s*/u.exec(text);
  if(circled && circled[1].normalize("NFKC").toLowerCase()===label)text=text.slice(circled[0].length).trim();
  const prefix=/^([A-Za-z가-힣]|\d{1,3})[.)]\s+/.exec(text);
  if(prefix && prefix[1].normalize("NFKC").toLowerCase()===label)text=text.slice(prefix[0].length).trim();
  return text.normalize("NFKC").toLowerCase()===label?"":text;
}
function imageQuestion(q) { return q.content_mode === "image" && Boolean(q.images?.length); }
function questionContent(q) {
  if(imageQuestion(q))return "";
  const prompt=contentLineBreaks(q.prompt).trim(), passage=contentLineBreaks(q.passage).trim();
  return passage && !prompt.includes(passage) ? [prompt,passage].filter(Boolean).join("\n\n") : (prompt || passage);
}
function isStructuredQuestion(q) { return ["ox","matching","blanks"].includes(q.type); }
function readResponseParts(raw) {
  if(Array.isArray(raw))return raw.map(String);
  try {const value=JSON.parse(String(raw || ""));return Array.isArray(value)?value.map(String):[];} catch(_){return [];}
}
function questionAnswered(q) {
  const raw=answers[String(q.num)];
  if(!isStructuredQuestion(q))return raw !== undefined && String(raw).trim()!=="";
  const parts=readResponseParts(raw);
  return parts.length===(q.response_items || []).length && parts.length>0 && parts.every((v)=>v.trim()!=="");
}
function responseOptions(q,item) {
  if(q.type==="ox" || item.type==="ox")return (q.type==="ox"?q.choices:(item.choices || ["O","X"])).map((v)=>({value:v,label:v==="O"?"○ (O)":v==="X"?"× (X)":v}));
  if(q.type==="matching")return (q.choices || []).map((v,i)=>({value:String(i+1),label:`${optionLabel(q,i)} ${imageQuestion(q)?"":choiceDisplayText(q,i,v)}`}));
  if(item.type==="choice")return (item.choices || []).map((v,i)=>({value:v,label:`${optionLabel(item,i)} ${imageQuestion(q)?"":choiceDisplayText(item,i,v)}`}));
  return (item.choices || []).map((v)=>({value:v,label:v}));
}
const matchingBoards=new Map();
let matchingActive=null,matchingDrag=null,matchingSuppressClickUntil=0;
const matchingColors=["#2563eb","#c2410c","#15803d","#9333ea","#be123c","#0e7490"];
function matchingQuestionGroup(q) {
  if(q.type!=="matching" || !q.images?.length)return [q];
  const same=(other)=>other?.type==="matching" && questionContent(other)===questionContent(q) &&
    other.choices?.length===q.choices.length && other.choices.every((c,i)=>c===q.choices[i] && optionLabel(other,i)===optionLabel(q,i)) &&
    other.images?.length===q.images.length && other.images.every((url,i)=>url===q.images[i]);
  const index=displayQuestions.indexOf(q);if(index<0)return [q];
  let start=index,end=index;while(start>0 && same(displayQuestions[start-1]))start--;while(end+1<displayQuestions.length && same(displayQuestions[end+1]))end++;
  return displayQuestions.slice(start,end+1);
}
function matchingY(index,count,height) {return (index+.5)*height/Math.max(1,count);}
function matchingPath(y1,y2,x2=700) {return `M 300 ${y1} C 450 ${y1},550 ${y2},${x2} ${y2}`;}
function matchingLinesHtml(board) {
  return board.rows.map((row,i)=>{
    const value=Number(readResponseParts(answers[String(row.qNum)])[row.part]);
    if(!Number.isInteger(value) || value<1 || value>board.choices.length)return "";
    return `<path d="${matchingPath(matchingY(i,board.rows.length,board.height),matchingY(value-1,board.choices.length,board.height))}" fill="none" stroke="${matchingColors[i%matchingColors.length]}" stroke-width="3" vector-effect="non-scaling-stroke" />`;
  }).join("");
}
function matchingBoardHtml(questions) {
  const q=questions[0],id=`match-${Number(q.num)}`,rows=questions.flatMap((item)=>(item.response_items || []).map((part,i)=>({qNum:item.num,part:i,label:`${item.source_label || item.num}번${item.response_items.length>1?` ${part.label || `답 ${i+1}`}`:""}${!imageQuestion(item) && part.text?` · ${contentLineBreaks(part.text)}`:""}`})));
  const choices=(q.choices || []).map((value,i)=>({value:String(i+1),label:`${optionLabel(q,i)}${imageQuestion(q)?"":" "+choiceDisplayText(q,i,value)}`}));
  if(!rows.length || !choices.length)return '<p>연결할 항목이 없습니다. 선생님께 문의해 주세요.</p>';
  const height=Math.max(220,Math.max(rows.length,choices.length)*64),board={id,rows,choices,height};matchingBoards.set(id,board);

    root.innerHTML='<div class="card">시험지의 답칸 정보를 읽지 못했습니다. 선생님께 Apps Script와 학생 페이지가 모두 최신 버전인지 확인해 달라고 요청해 주세요.</div>';
    return;
  }
  document.title = EXAM.title;
  document.getElementById("examTitle").textContent = EXAM.title;
  if (EXAM.header_logo) {
    const logo = document.getElementById("headerLogo");
    logo.src = EXAM.header_logo;
    logo.style.display = "inline-block";
  }

  if (!EXAM.is_open) {
    root.innerHTML = `<div class="card" style="text-align:center;padding:40px 20px;"><h2 style="color:var(--red);margin:0 0 8px;">응시가 마감된 시험지입니다.</h2><p style="color:var(--muted);margin:0;">선생님께 문의해 주세요.</p></div>`;
    return;
  }

  const ruleNotes = [];
  if (EXAM.time_limit_min > 0) ruleNotes.push(`제한 시간 ${EXAM.time_limit_min}분`);
  if (EXAM.max_away_count > 0) ruleNotes.push(`${EXAM.max_away_count}회 이탈 시 자동 제출`);
  ruleNotes.push("지문 복사·붙여넣기 제한");
  const ruleLine = `<div style="margin-top:8px;font-size:0.8rem;color:var(--muted);">※ 학년·반·번호를 모두 입력해 주세요. (${ruleNotes.join(" · ")})</div>`;

  root.innerHTML = `
    <section class="card away-banner" id="awayBanner"></section>
    <section class="card">
      <div class="info-grid">
        <div class="field"><label>학년 (필수)</label><input id="grade" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="예: 6" /></div>
        <div class="field"><label>반 (필수)</label><input id="classNum" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="예: 1" /></div>
        <div class="field"><label>번호 (필수)</label><input id="studentNum" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="예: 20" /></div>
      </div>
      ${ruleLine}
    </section>
    <section class="card result-banner" id="resultBanner"></section>
    ${studentWorkspaceHtml()}
    <div class="exam-viewport" id="examViewport"><div id="examBody" class="exam-protected"></div></div>
    <div class="submit-bar" id="submitBar">
      <button type="button" class="btn-submit" id="submitBtn">답안 제출하기</button>
    </div>
  `;

  baseInnerWidth = window.innerWidth;
  baseInnerHeight = window.innerHeight;
  renderQuestions();
  initStudentWorkspace();
  attachAntiCopyHandlers();
  updateProgress();
  examStartedAt = Date.now();
  startExamTimer();
  document.getElementById("submitBtn").addEventListener("click", () => submitExam(false));
  if(TEACHER_TRIAL){
    ["grade","classNum","studentNum"].forEach((id)=>{document.getElementById(id).value="체험";});
    showInlineNotice("교사 체험 모드입니다. 정답을 넣지 않아도 풀 수 있으며, 제출 기록은 저장하지 않습니다.");
  }
}

function startExamTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  const limitMin = Math.max(0, Number((EXAM && EXAM.time_limit_min) || 0));
  const pill = document.getElementById("timerPill");
  if (!limitMin || !pill) return;
  const deadline = examStartedAt + limitMin * 60 * 1000;
  pill.style.display = "inline-block";

  const tick = () => {
    if (examSubmitted) {
      clearInterval(timerInterval);
      timerInterval = null;
      return;
    }
    const remSec = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    const mm = String(Math.floor(remSec / 60)).padStart(2, "0");
    const ss = String(remSec % 60).padStart(2, "0");
    pill.textContent = `⏱ ${mm}:${ss}`;
    pill.classList.toggle("pill-timer-warn", remSec <= 60);
    if (remSec <= 0 && !autoSubmitTriggered) {
      autoSubmitTriggered = true;
      clearInterval(timerInterval);
      timerInterval = null;
      showInlineNotice("⏱ 시험 제한 시간이 종료되어 답안을 자동 제출합니다.");
      submitExam(true);
    }
  };
  tick();
  timerInterval = setInterval(tick, 500);
}

function attachAntiCopyHandlers() {
  const body = document.getElementById("examBody");
  if (!body) return;
  ["copy", "cut"].forEach((evt) => {
    body.addEventListener(evt, (e) => {
      if (!examSubmitted) e.preventDefault();
    });
  });
  body.addEventListener("contextmenu", (e) => {
    if (!examSubmitted && (!e.target || e.target.tagName !== "INPUT")) {
      e.preventDefault();
    }
  });
  body.addEventListener("selectstart", (e) => {
    if (!examSubmitted && (!e.target || e.target.tagName !== "INPUT")) {
      e.preventDefault();
    }
  });
  body.addEventListener("paste", (e) => {
    if (!examSubmitted && e.target && e.target.classList && e.target.classList.contains("short-input")) {
      e.preventDefault();
      showInlineNotice("⚠️ 단답형 입력칸에는 복사한 내용을 붙여넣을 수 없습니다.");
    }
  });
}

async function init() {
  const root = document.getElementById("mainRoot");
  if(TEACHER_TRIAL){
    root.innerHTML='<div class="card">교사 화면의 시험지 초안을 기다리고 있습니다.</div>';
    window.parent.postMessage({type:"qr-exam-trial-ready"},location.origin==="null"?"*":location.origin);return;
  }
  if (!API_URL || !EXAM_ID) {
    root.innerHTML = `<div class="card" style="text-align:center;padding:40px 20px;">
      <h2 style="color:var(--navy);margin:0 0 8px;">공용 QR 시험지 뷰어</h2>
      <p style="color:var(--muted);margin:0;">선생님이 안내한 QR코드를 스캔해 접속해 주세요. (주소 파라미터 <code>api</code>와 <code>id</code>가 필요합니다.)</p>
    </div>`;
    return;
  }

  try {
    const url = `${API_URL}${API_URL.includes("?") ? "&" : "?"}action=get_exam&id=${encodeURIComponent(EXAM_ID)}`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data.ok || !data.exam) {
      root.innerHTML = `<div class="card" style="text-align:center;padding:40px 20px;color:var(--red);font-weight:700;">${escapeHtml(data.error || "시험지를 찾을 수 없습니다.")}</div>`;
      return;
    }

    EXAM = data.exam;
    if (data.requires_pin) {
      document.title = EXAM.title;
      document.getElementById("examTitle").textContent = EXAM.title;
      if (EXAM.header_logo) {
        const logo = document.getElementById("headerLogo");
        logo.src = EXAM.header_logo;
        logo.style.display = "inline-block";
      }
      if (!EXAM.is_open) {
        root.innerHTML = `<div class="card" style="text-align:center;padding:40px 20px;"><h2 style="color:var(--red);margin:0 0 8px;">응시가 마감된 시험지입니다.</h2><p style="color:var(--muted);margin:0;">선생님께 문의해 주세요.</p></div>`;
        return;
      }
      root.innerHTML = `
        <section class="card" style="max-width:440px;margin:28px auto;text-align:center;padding:28px 22px;">
          <h2 style="margin:0 0 8px;color:var(--navy);">🔐 수업 입장 코드 입력</h2>
          <p style="margin:0 0 16px;font-size:0.9rem;color:var(--muted);">선생님이 칠판에 안내한 입장 코드를 입력해야 시험지가 열립니다.</p>
          <input id="pinInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="입장 코드 입력" style="width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:1.1rem;text-align:center;font-weight:700;" />
          <div id="pinErr" style="color:var(--red);font-size:0.86rem;font-weight:700;margin-top:8px;min-height:18px;"></div>
          <button type="button" class="btn-submit" id="pinVerifyBtn" style="margin-top:10px;width:100%;padding:12px;">시험 시작하기</button>
        </section>
      `;
      const verifyFn = async () => {
        const pin = document.getElementById("pinInput").value.trim();
        const errEl = document.getElementById("pinErr");
        const vBtn = document.getElementById("pinVerifyBtn");
        if (!pin) { errEl.textContent = "입장 코드를 입력해 주세요."; return; }
        vBtn.disabled = true;
        vBtn.textContent = "확인 중...";
        errEl.textContent = "";
        try {
          const vRes = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "verify_pin", exam_id: EXAM_ID, pin })
          });
          const vData = await vRes.json();
          if (!vData.ok || !vData.exam) {
            errEl.textContent = vData.error || "입장 코드가 올바르지 않습니다.";
            vBtn.disabled = false;
            vBtn.textContent = "시험 시작하기";
            return;
          }
          verifiedPin = pin;
          EXAM = vData.exam;
          startExamSession();
        } catch (e) {
          errEl.textContent = "네트워크 오류가 발생했습니다. 다시 시도해 주세요.";
          vBtn.disabled = false;
          vBtn.textContent = "시험 시작하기";
        }
      };
      document.getElementById("pinVerifyBtn").addEventListener("click", verifyFn);
      document.getElementById("pinInput").addEventListener("keydown", (e) => { if (e.key === "Enter") verifyFn(); });
      return;
    }

    startExamSession();
  } catch (err) {
    root.innerHTML = `<div class="card" style="text-align:center;padding:40px 20px;color:var(--red);">시험지를 불러오지 못했습니다. 네트워크 연결 또는 선생님 주소를 확인해 주세요.</div>`;
  }
}

function renderQuestions() {
  const body = document.getElementById("examBody");
  matchingBoards.clear();matchingActive=null;matchingDrag=null;
  body.innerHTML="";
  if (EXAM.mode === "omr_pages" && EXAM.page_images && EXAM.page_images.length) {
    displayQuestions = EXAM.questions.map((q) => ({ ...q, _dispNum: q.num }));
    const pagesCard = document.createElement("section");
    pagesCard.className = "card omr-pages-wrap";
    pagesCard.innerHTML = `<h3 style="margin:0 0 10px;color:var(--navy);">시험지 원문</h3>` +
      EXAM.page_images.map((u, idx) => `<img data-zoomable tabindex="0" role="button" src="${u}" alt="시험지 ${idx + 1}쪽" />`).join("");
    body.appendChild(pagesCard);

    const omrCard = document.createElement("section");
    omrCard.className = "card";
    omrCard.innerHTML = `<h3 style="margin:0 0 8px;color:var(--navy);">OMR 답안 입력</h3>`;
    displayQuestions.forEach((q) => {
      const group=q.type==="matching"?matchingQuestionGroup(q):[q];
      if(group[0]!==q)return;
      const row = document.createElement("div");
      row.className = "omr-pad-row";
      if (isStructuredQuestion(q)) {
        row.style.display="block";
        row.innerHTML=`<strong>${group.map((item)=>escapeHtml(item.num)).join("·")}번 · ${escapeHtml(questionContent(q))}</strong>${q.type==="matching"?matchingBoardHtml(group):structuredInputsHtml(q)}`;
      } else if (["short","sentence"].includes(q.type)) {
        row.innerHTML = `<strong>${q.num}번 ${q.prompt ? "· " + escapeHtml(q.prompt) : ""}</strong><input type="text" class="short-input" style="max-width:260px;margin:0;" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="정답 입력" oninput="setShort('${q.num}', this.value)" />`;
      } else {
        const pills = q.choices.map((c, ci) => {
          const val = String(ci + 1);
          return `<button type="button" class="omr-pill" id="omr-${q.num}-${val}" onclick="pickChoice('${q.num}', '${val}', [${q.choices.map((_, k) => `'${k + 1}'`).join(",")}], ${Boolean(q.multi)}, 'omr')">${escapeHtml(optionLabel(q,ci))}</button>`;
        }).join("");
        row.innerHTML = `<strong>${q.num}번 ${q.multi ? "<small style='color:var(--blue);'>(복수)</small>" : ""}</strong><div class="omr-pills">${pills}</div>`;
      }
      row.innerHTML=group.map(questionNoteButtonHtml).join("")+row.innerHTML;
      omrCard.appendChild(row);
    });
    body.appendChild(omrCard);
    return;
  }

  // Source numbers and option positions also identify pictures and matching targets.
  const baseOrder = [...EXAM.questions];
  displayQuestions = baseOrder.map((q, di) => {
    const dispChoices = (q.choices || []).map((txt, ci) => ({ text: txt, origVal: String(ci + 1) }));
    return { ...q, _dispNum: q.num, _dispChoices: dispChoices };
  });

  displayQuestions.forEach((q) => {
    const group=q.type==="matching"?matchingQuestionGroup(q):[q];
    if(group[0]!==q)return;
    const card = document.createElement("section");
    card.className = "card";
    let html = `<div style="font-size:1.02rem;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75;"><strong style="color:var(--navy);margin-right:6px;">${escapeHtml(group.map((item)=>item.source_label || item._dispNum).join("·"))}.</strong>${escapeHtml(questionContent(q))}${q.multi ? ' <span style="font-size:0.8rem;color:var(--blue);font-weight:700;">[모두 고르기]</span>' : ''}</div>`;
    if (q.images && q.images.length) {
      html += `<div class="q-imgs ${imageQuestion(q)?"original-question":""}">${q.images.map((u) => `<img data-zoomable tabindex="0" role="button" src="${u}" alt="${q._dispNum}번 원본 문제" />`).join("")}</div>`;
    }
    if (isStructuredQuestion(q)) {
      html += q.type==="matching"?matchingBoardHtml(group):structuredInputsHtml(q);
    } else if (q.type === "sentence") {
      html += `<textarea class="short-input" rows="3" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="문장으로 답을 입력하세요" oninput="setShort('${q.num}', this.value)"></textarea>`;
    } else if (q.type === "short") {
      html += `<input type="text" class="short-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="답을 입력하세요" oninput="setShort('${q.num}', this.value)" />`;
    } else {
      const origValsArg = `[${q._dispChoices.map((c) => `'${c.origVal}'`).join(",")}]`;
      html += `<div class="choices">` + q._dispChoices.map((cObj, ci) => {
        return `
          <button type="button" class="choice-btn" id="ch-${q.num}-${cObj.origVal}" onclick="pickChoice('${q.num}', '${cObj.origVal}', ${origValsArg}, ${Boolean(q.multi)}, 'ch')">
            <span class="check-box">✓</span>
            <span style="font-weight:700;color:var(--muted);">${escapeHtml(optionLabel(q,ci))}</span>
            <span style="white-space:pre-wrap;overflow-wrap:anywhere;">${escapeHtml(imageQuestion(q)?"":choiceDisplayText(q,ci,cObj.text))}</span>
          </button>
        `;
      }).join("") + `</div>`;
    }
    card.innerHTML = group.map(questionNoteButtonHtml).join("")+html;
    body.appendChild(card);
  });
}

async function submitExam(isAuto = false) {
  endAway();
  const gradeEl = document.getElementById("grade");
  const classEl = document.getElementById("classNum");
  const numEl = document.getElementById("studentNum");
  const gradeVal = gradeEl ? gradeEl.value.trim() : "";
  const classVal = classEl ? classEl.value.trim() : "";
  const numVal = numEl ? numEl.value.trim() : "";

  if (!isAuto) {
    if (!gradeVal) { ignoreBlurUntil = Date.now() + 800; alert("학년을 입력해 주세요."); if (gradeEl) gradeEl.focus(); return; }
    if (!classVal) { ignoreBlurUntil = Date.now() + 800; alert("반을 입력해 주세요."); if (classEl) classEl.focus(); return; }
    if (!numVal) { ignoreBlurUntil = Date.now() + 800; alert("번호를 입력해 주세요."); if (numEl) numEl.focus(); return; }

    const listForCheck = displayQuestions.length ? displayQuestions : EXAM.questions;
    const unanswered = listForCheck
      .filter((q) => !questionAnswered(q))
      .map((q) => q._dispNum || q.num);
    if (unanswered.length) {
      ignoreBlurUntil = Date.now() + 1000;
      const ok = confirm(`아직 풀지 않은 문항(${unanswered.join("번, ")}번)이 있습니다.\n그대로 제출할까요?`);
      ignoreBlurUntil = Date.now() + 500;
      if (!ok) return;
    }
  }

  const btn = document.getElementById("submitBtn");
  if (btn) {
    btn.disabled = true;
    btn.textContent = isAuto ? "자동 제출 중..." : "제출 중...";
  }

  const elapsedSec = examStartedAt > 0 ? Math.max(1, Math.round((Date.now() - examStartedAt) / 1000)) : 0;

  try {
    // Use text/plain to avoid CORS preflight OPTIONS on Google Apps Script
    if(TEACHER_TRIAL){
      examSubmitted=true;closeQuestionNotes();if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
      document.getElementById("submitBar").style.display="none";
      document.querySelectorAll("#mainRoot button,#mainRoot input,#mainRoot select,#mainRoot textarea").forEach((el)=>{el.disabled=true;});
      const banner=document.getElementById("resultBanner"),count=EXAM.questions.filter(questionAnswered).length;
      banner.innerHTML=`<div style="padding:12px;"><strong>체험 제출이 완료되었습니다.</strong><p>${count} / ${EXAM.questions.length}문항에 응답했습니다.</p><p>정답 유무와 관계없이 동작을 확인하는 체험입니다. 점수는 계산하지 않으며 학생 제출 기록·교사용 정답을 변경하지 않습니다. 다시 풀려면 위의 ‘처음부터 다시 풀기’를 누르세요.</p></div>`;
      banner.classList.add("show");window.scrollTo({top:0,behavior:"smooth"});return;
    }
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "submit",
        exam_id: EXAM.id,
        pin: verifiedPin,
        grade: gradeVal || (isAuto ? "미입력" : ""),
        class_num: classVal || (isAuto ? "미입력" : ""),
        student_num: numVal || (isAuto ? "미입력" : ""),
        away_count: awayCount,
        away_seconds: Math.round(awayTotalMs / 1000),
        elapsed_seconds: elapsedSec,
        auto_submit: Boolean(isAuto),
        answers
      })
    });
    const data = await res.json();
    if (!data.ok) {
      ignoreBlurUntil = Date.now() + 500;
      if (!isAuto) alert(data.error || "제출에 실패했습니다.");
      if (btn) {
        btn.disabled = false;
        btn.textContent = "답안 제출하기";
      }
      return;
    }

    examSubmitted = true;
    closeQuestionNotes();
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    document.getElementById("submitBar").style.display = "none";
    document.querySelectorAll("#mainRoot button, #mainRoot input, #mainRoot select, #mainRoot textarea").forEach((el) => { el.disabled = true; });
    const banner = document.getElementById("resultBanner");

    const qByNum = {};
    (EXAM.questions || []).forEach((q) => { qByNum[String(q.num)] = q; });
    const dispNumByOrig = {};
    displayQuestions.forEach((dq) => { dispNumByOrig[String(dq.num)] = dq._dispNum || dq.num; });
    const fmtAns = (qOrigNum, rawVal) => {
      if (!rawVal) return "미응답";
      const qObj = qByNum[String(qOrigNum)];
      if (qObj && qObj.type === "choice" && qObj.choices && qObj.choices.length) {
        return String(rawVal).split(",").map((v) => {
          const idx = Number(v.trim()) - 1;
          return (idx >= 0 && qObj.choices[idx] !== undefined) ? qObj.choices[idx] : v;
        }).join(", ");
      }
      return String(rawVal);
    };

    if (data.pending_count > 0) {
      banner.innerHTML=pendingResultHtml(data);
    } else if (data.show_score && data.score_mode !== "score_only" && Array.isArray(data.details)) {
      const pct = data.total_possible ? Math.round((data.total_earned / data.total_possible) * 1000) / 10 : 0;
      const orderedDetails = displayQuestions.length
        ? displayQuestions.map((dq) => data.details.find((d) => String(d.num) === String(dq.num))).filter(Boolean)
        : data.details;
      const oxHtml = orderedDetails.map((d) => {
        const dn = dispNumByOrig[String(d.num)] || d.num;
        return `
        <div class="ox-item ${d.is_correct ? "ok" : d.earned > 0 ? "partial" : "bad"}">
          <div style="font-size:0.78rem;">${dn}번</div>
          <div>${d.is_correct ? "O" : d.earned > 0 ? "△" : "X"}</div>
        </div>
      `;
      }).join("");
      const expHtml = orderedDetails.map((d) => {
        const dn = dispNumByOrig[String(d.num)] || d.num;
        return `
        <div style="padding:7px 10px;border-bottom:1px solid var(--border);font-size:0.88rem;">
          <strong>${dn}번</strong> · 내 답: <b>${escapeHtml(fmtAns(d.num, d.picked))}</b> · 정답: <b style="color:var(--green);">${escapeHtml(fmtAns(d.num, d.correct))}</b> · ${d.earned}/${d.points}점
          ${d.explain ? `<div style="color:var(--muted);margin-top:2px;">${escapeHtml(d.explain)}</div>` : ""}
        </div>
      `;
      }).join("");
      banner.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <div>
            <div style="font-size:1.15rem;font-weight:800;color:var(--navy);">제출 및 채점이 완료되었습니다!</div>
            <div style="font-size:0.88rem;color:var(--muted);">제출 시각: ${data.submitted_at}</div>
          </div>
          <div style="font-size:1.7rem;font-weight:800;color:var(--blue);">${data.total_earned} / ${data.total_possible}점 (${pct}점)</div>
        </div>
        <div class="ox-grid">${oxHtml}</div>
        <div style="margin-top:14px;border-top:1px solid var(--border);">${expHtml}</div>
      `;
    } else if (data.show_score) {
      const pct = data.total_possible ? Math.round((data.total_earned / data.total_possible) * 1000) / 10 : 0;
      banner.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <div>
            <div style="font-size:1.15rem;font-weight:800;color:var(--navy);">답안이 정상적으로 제출되었습니다!</div>
            <div style="font-size:0.88rem;color:var(--muted);">제출 시각: ${data.submitted_at} · (정답·해설은 비공개 설정입니다)</div>
          </div>
          <div style="font-size:1.7rem;font-weight:800;color:var(--blue);">${data.total_earned} / ${data.total_possible}점 (${pct}점)</div>
        </div>
      `;
    } else {
      banner.innerHTML = `<div style="text-align:center;padding:12px 0;"><div style="font-size:1.2rem;font-weight:800;color:var(--green);">답안이 정상적으로 제출되었습니다!</div><div style="font-size:0.9rem;color:var(--muted);margin-top:4px;">제출 시각: ${data.submitted_at}</div></div>`;
    }
    banner.classList.add("show");
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (err) {
    if (!isAuto) alert("제출 중 네트워크 오류가 발생했습니다. 다시 시도해 주세요.");
    if (btn) {
      btn.disabled = false;
      btn.textContent = "답안 제출하기";
    }
  }
}

/* Source image enlargement: shared with the student page. */
let sourceImageZoom=100,sourceImageBaseWidth=0,sourceImageOpener=null;
function setSourceImageZoom(value) {
  const amount=Number(value);if(!Number.isFinite(amount))return;
  sourceImageZoom=Math.max(25,Math.min(500,Math.round(amount)));
  const img=document.getElementById("sourceImageLarge");
  img.style.width=`${Math.max(1,sourceImageBaseWidth*sourceImageZoom/100)}px`;
  document.getElementById("sourceImageScaleLabel").textContent=`${sourceImageZoom}%`;
}
function fitSourceImage() {
  const img=document.getElementById("sourceImageLarge"),stage=document.getElementById("sourceImageStage");
  if(!img.naturalWidth || !img.naturalHeight)return;
  sourceImageBaseWidth=img.naturalWidth*Math.min(1,Math.max(1,stage.clientWidth-24)/img.naturalWidth,Math.max(1,stage.clientHeight-24)/img.naturalHeight);
  setSourceImageZoom(100);stage.scrollTop=0;stage.scrollLeft=0;
}
function openSourceImage(image) {
  if(!image?.src)return;
  sourceImageOpener=image;
  document.getElementById("sourceImageTitle").textContent=image.alt || "원본 이미지";
  document.getElementById("sourceImageModal").hidden=false;
  const large=document.getElementById("sourceImageLarge");large.onload=fitSourceImage;large.style.width="";sourceImageZoom=100;sourceImageBaseWidth=0;
  document.getElementById("sourceImageScaleLabel").textContent="100%";
  large.src=image.currentSrc || image.src;fitSourceImage();
  document.getElementById("sourceImageClose").focus?.();
}
function closeSourceImage() {
  document.getElementById("sourceImageModal").hidden=true;
  const large=document.getElementById("sourceImageLarge");large.onload=null;large.removeAttribute?.("src");
  sourceImageOpener?.focus?.();sourceImageOpener=null;
}
function initSourceImageViewer() {
  document.addEventListener("click",(event)=>{const img=event.target?.closest?.("img[data-zoomable]");if(img)openSourceImage(img);});
  document.addEventListener("keydown",(event)=>{
    if(event.key==="Escape" && !document.getElementById("sourceImageModal").hidden){event.preventDefault();closeSourceImage();}
    else if((event.key==="Enter" || event.key===" ") && event.target?.matches?.("img[data-zoomable]")){event.preventDefault();openSourceImage(event.target);}
  });
  for(const [id,handler] of [["sourceImageClose",closeSourceImage],["sourceImagePlus",()=>setSourceImageZoom(sourceImageZoom+25)],["sourceImageMinus",()=>setSourceImageZoom(sourceImageZoom-25)],["sourceImageFit",fitSourceImage],["sourceImageOriginal",()=>{const img=document.getElementById("sourceImageLarge");if(sourceImageBaseWidth)setSourceImageZoom(img.naturalWidth/sourceImageBaseWidth*100);}]])document.getElementById(id).addEventListener("click",handler);
}
initSourceImageViewer();


window.addEventListener("message",(event)=>{
  if(!TEACHER_TRIAL || trialInitialized || window.parent===window || event.source!==window.parent || event.origin!==location.origin || event.data?.type!=="qr-exam-trial-start")return;
  const incoming=event.data.exam;if(!incoming || !Array.isArray(incoming.questions))return;
  EXAM={...incoming,is_open:true,time_limit_min:0,max_away_count:0};trialInitialized=true;startExamSession();
});
init();
</script>
